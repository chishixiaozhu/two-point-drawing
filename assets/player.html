<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双点描形</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080d19;color:#e4ebf8;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1160px;margin:30px auto;padding:0 20px}header{display:flex;align-items:baseline;gap:18px}h1{font-size:23px;font-weight:600}small,#status{color:#a3b1c8}canvas{display:block;width:100%;height:auto;background:#050a16;border-radius:16px;border:1px solid #202c43}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0}button,a{border:1px solid #425473;background:#18263b;color:#e8f1ff;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.5}input{flex:1;min-width:100px;accent-color:#a6d9ff}[hidden]{display:none!important}#time{font-variant-numeric:tabular-nums}</style>
<main><header><h1>双点描形</h1><small>12秒 · 静音</small></header><canvas id="film" width="1920" height="1080" aria-label="双点坐标轴描形动画"></canvas><nav><button id="play">播放</button><button id="restart">重播</button><input id="seek" type="range" aria-label="播放进度" min="0" max="12" step=".01" value="0"><span id="time">0.0 / 12.0</span><button id="export" hidden>导出视频</button><a id="save" hidden>保存视频</a></nav><p id="status">想换形状或颜色，回到 WorkBuddy 对话中告诉它即可。</p></main><script>__SCRIPT__</script></html>
